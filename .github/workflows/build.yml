name: CI / Build Automation

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Test Suite
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run Tests
        run: go test -v ./...

  build-matrix:
    name: Build Multi-Platform Binaries
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - os: darwin
            arch: arm64
            ext: ""
          - os: darwin
            arch: amd64
            ext: ""
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
          - os: windows
            arch: amd64
            ext: ".exe"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Compile Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/tabwrangler-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/tabwrangler

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabwrangler-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/tabwrangler-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
